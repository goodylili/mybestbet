x-local-env: &local-env
  APP_ENV: dev
  WEB_ORIGIN: http://localhost:4040
  AUTH_SECURE_COOKIES: "false"
  AUTH_GOOGLE_REDIRECT_URL: http://localhost:4040/api/v1/auth/google/callback
  AUTH_EMAIL_FROM: mybestbet <onboarding@resend.dev>

x-go-local: &go-local
  environment: *local-env
  develop:
    watch:
      - {action: rebuild, path: ../mybestbet-backend, ignore: [bin/, testdata/, docs/]}

services:
  redis: {ports: !reset []}
  migrate: {environment: *local-env}
  ingestor: *go-local
  browserd: *go-local
  resolver: *go-local
  engine: *go-local
  notifier: *go-local
  stats: *go-local
  api:
    <<: *go-local
    ports: !override ["127.0.0.1:8081:8080"]
  web:
    ports: ["127.0.0.1:4040:3000"]
    develop:
      watch:
        - {action: rebuild, path: ../mybestbet-frontend, ignore: [node_modules/, .next/, tsconfig.tsbuildinfo, next-env.d.ts]}
  caddy: {profiles: [prod]}
