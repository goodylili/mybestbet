env: ${APP_ENV}
browserdUrl: http://localhost:9222
discovery: 10m
engineShards: 16
flushEvery: 500ms
flushRows: 5000

auth:
  accessTtl: 15m
  refreshTtl: 720h
  otpTtl: 10m
  otpCooldown: 60s
  otpMaxAttempts: 5
  secureCookies: ${AUTH_SECURE_COOKIES}
  trustProxy: true
  webOrigin: "${WEB_ORIGIN}"
  allowedOrigins: ["${WEB_ORIGIN}"]
  emailFrom: "${AUTH_EMAIL_FROM}"
  googleRedirectUrl: "${AUTH_GOOGLE_REDIRECT_URL}"

resolve:
  kickoffTolerance: 15m
  sportKickoffTolerance: {tennis: 12h}
  collegeLeagues: [NCAAF, NCAAB]
  dedup: {every: 5m, purgeGrace: 10m, purgeBatch: 50}

