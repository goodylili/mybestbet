tiers:
  - {name: hot, within: 2h, interval: 5s, jitter: 0.2}
  - {name: near, within: 6h, interval: 10s, jitter: 0.1}
  - {name: warm, within: 24h, interval: 30s, jitter: 0.1}
  - {name: cold, within: 168h, interval: 3m, jitter: 0.1}
  - {name: far, within: 2160h, interval: 15m, jitter: 0.1}

pricing:
  defaultDevig: power
  devigMethod: {BTTS: multiplicative, DNB: multiplicative}
  minFairSources: 3
  arbMinMargin: 0.005
  evMin: 0.03
  maxLegSkew: 15s
  minTouchLiquidity: 50
  deepBookLiquidity: 1000
  deepBookWeight: 3
  maxOverround: 0.15
  evProbRange: {min: 0.10, max: 0.90}
  minMoveHold: 10s
  quoteMaxAge:
    live: 90s
    preMatch: [{within: 2h, maxAge: 3m}, {within: 24h, maxAge: 20m}, {within: 2160h, maxAge: 1h}]
    minByType: {prediction: 6m}

telegram:
  maxAlertsPerHour: 30
  realertGrowth: 0.5
