name: deploy
on:
  push: {branches: [main]}
concurrency: {group: deploy, cancel-in-progress: false}
permissions: {contents: read, packages: write}
env:
  IMAGE_OWNER: ${{ github.repository_owner }}
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: mybestbet-go, context: mybestbet-backend, file: mybestbet-backend/Dockerfile}
          - {name: mybestbet-web, context: mybestbet-frontend, file: mybestbet-frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.sha }},ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:latest
  vps:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/mybestbet/deploy
            export IMAGE_OWNER=${{ env.IMAGE_OWNER }} IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose run --rm migrate
            docker compose --profile prod up -d --remove-orphans
